<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>দোকান</title>
<style>
  :root { --c1: #1565c0; --c2: #0d47a1; --bg: #f4f6fa; --ink: #1c2430; --card: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: "Noto Sans Bengali", "Hind Siliguri", system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  header { background: linear-gradient(160deg, var(--c1), var(--c2)); color: #fff; text-align: center; padding: 36px 20px 40px; }
  .logo { width: 84px; height: 84px; border-radius: 50%; background: #fff; color: var(--c1); font-size: 40px; font-weight: 700;
          display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; overflow: hidden; border: 4px solid rgba(255,255,255,.7); }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  header h1 { font-size: 26px; }
  header p { opacity: .92; margin-top: 4px; }
  main { max-width: 560px; margin: -18px auto 0; padding: 0 16px 100px; }
  .box { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
  .box h2 { font-size: 18px; margin-bottom: 8px; color: var(--c2); }
  .info div { padding: 3px 0; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #e8ecf2; }
  .item:first-of-type { border-top: 0; }
  .thumb { width: 64px; height: 64px; border-radius: 12px; background: #e3ecfa; flex: none; object-fit: cover;
           display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .meta { flex: 1; min-width: 0; }
  .meta b { display: block; }
  .meta small { color: #667; }
  .price { font-weight: 700; color: var(--c2); white-space: nowrap; }
  .order { border: 0; background: #25d366; color: #fff; font-family: inherit; font-size: 14px; font-weight: 700;
           padding: 8px 14px; border-radius: 20px; text-decoration: none; white-space: nowrap; }
  .float { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 528px; margin: 0 auto; text-align: center;
           background: #25d366; color: #fff; font-size: 18px; font-weight: 700; text-decoration: none; padding: 15px; border-radius: 30px;
           box-shadow: 0 8px 22px rgba(0,0,0,.25); }
  footer { text-align: center; color: #889; font-size: 13px; padding-bottom: 90px; }
</style>
</head>
<body>
<header>
  <div class="logo" id="logo"></div>
  <h1 id="shopName"></h1>
  <p id="tagline"></p>
</header>

<main>
  <div class="box info" id="info"></div>
  <div class="box"><h2>আমাদের পণ্য ও দাম</h2><div id="list"></div></div>
</main>

<a class="float" id="waBtn" target="_blank" rel="noopener">💬 WhatsApp-এ অর্ডার করুন</a>
<footer id="foot"></footer>

<script>
// ====== শুধু এই অংশ বদলালেই নতুন দোকানের পেজ তৈরি ======
const SHOP = {
  name: "রুবির কালেকশন",
  tagline: "সুন্দর ও মানসম্মত পণ্য, সাশ্রয়ী দামে",
  logo: "",                         // লোগোর ছবির ফাইলের নাম, যেমন "logo.jpg"। খালি রাখলে নামের প্রথম অক্ষর
  color1: "#1565c0",
  color2: "#0d47a1",
  whatsapp: "8801XXXXXXXXX",        // দেশের কোডসহ নম্বর, + বা 0 ছাড়া। যেমন 8801712345678
  address: "ধানমন্ডি, ঢাকা",
  hours: "প্রতিদিন সকাল ১০টা - রাত ৯টা",
  products: [
    { name: "পণ্য ১", note: "সংক্ষিপ্ত বিবরণ", price: "৳ ৫০০", img: "" },
    { name: "পণ্য ২", note: "সংক্ষিপ্ত বিবরণ", price: "৳ ৮০০", img: "" },
    { name: "পণ্য ৩", note: "সংক্ষিপ্ত বিবরণ", price: "৳ ১২০০", img: "" }
  ]
};
// ======================================================

const $ = id => document.getElementById(id);
const rs = document.documentElement.style;
rs.setProperty("--c1", SHOP.color1);
rs.setProperty("--c2", SHOP.color2);
document.title = SHOP.name;
$("shopName").textContent = SHOP.name;
$("tagline").textContent = SHOP.tagline;

// লোগো
if (SHOP.logo) {
  const im = new Image();
  im.onload = () => { $("logo").textContent = ""; $("logo").appendChild(im); };
  im.src = SHOP.logo;
}
$("logo").textContent = SHOP.name.charAt(0);

// তথ্য
$("info").innerHTML = "<h2>যোগাযোগ</h2><div>📍 " + SHOP.address + "</div><div>🕘 " + SHOP.hours + "</div>";

// WhatsApp লিংক
function wa(text) {
  return "https://wa.me/" + SHOP.whatsapp + "?text=" + encodeURIComponent(text);
}
$("waBtn").href = wa("আসসালামু আলাইকুম, " + SHOP.name + " থেকে অর্ডার করতে চাই।");

// পণ্যের তালিকা
const list = $("list");
SHOP.products.forEach(p => {
  const row = document.createElement("div");
  row.className = "item";
  const th = p.img ? Object.assign(new Image(), { src: p.img, className: "thumb" })
                   : Object.assign(document.createElement("div"), { className: "thumb", textContent: "🛍️" });
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = "<b></b><small></small>";
  meta.querySelector("b").textContent = p.name;
  meta.querySelector("small").textContent = p.note || "";
  const price = document.createElement("div");
  price.className = "price";
  price.textContent = p.price;
  const a = document.createElement("a");
  a.className = "order";
  a.target = "_blank"; a.rel = "noopener";
  a.textContent = "অর্ডার";
  a.href = wa("আমি \"" + p.name + "\" (" + p.price + ") অর্ডার করতে চাই।");
  row.append(th, meta, price, a);
  list.appendChild(row);
});

$("foot").textContent = "© " + new Date().getFullYear() + " " + SHOP.name + " • তৈরি: App Ghor";
</script>
</body>
</html>
